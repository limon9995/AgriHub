    <!-- Hero start -->
     <section class="container">
        <p class="display-4 text-center mt-3">Contact</p>
        <div class="row">
          <div class="col-sm-6 card p-5">
            <h2 class="text-bg-primary p-2">For Direct Contact</h2>
            <p>Name: Mr. X</p>
            <p>Designation: HR</p>
            <p>Phone: +88026543217</p>
          </div>
          <div class="col-sm-6 card p-5">
            <h2 class="text-bg-primary p-2">Touch With Us</h2>
            <form id="f" class="row g-3 needs-validation" novalidate>
              <input type="text" class="form-control" id="validationCustom01" placeholder="Name" required>
              <input type="email" class="form-control" id="validationCustom01" placeholder="Email" required>
              <input type="tel" class="form-control" id="validationCustom01" placeholder="+880...." required>
              <input type="file" class="form-control" id="validationCustom01" placeholder="Upload Picture or Document">
              <textarea name="" id="" cols="30" rows="5" placeholder="Message"></textarea>
              <button class="btn btn-primary" type="submit">Submit form</button>

            </form>
            <script>
              f.addEventListener('submit', event => {
                if (!f.checkValidity()) {
                  event.preventDefault()
                  event.stopPropagation()
                  f.classList.add('was-validated')
                }else alert("Submitted!")

                
              }, false)

            </script>
          </div>
        </div>
     </section>

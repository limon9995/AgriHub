name: FB post & schedule
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r fb_automation/requirements.txt
      - run: python fb_automation/main.py post
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
      - run: |
          git config user.name "fb-bot"; git config user.email "fb-bot@users.noreply.github.com"
          git add content/posts.csv
          git diff --cached --quiet || (git commit -m "Update post statuses" && git push)

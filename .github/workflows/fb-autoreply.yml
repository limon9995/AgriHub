name: FB auto-reply
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r fb_automation/requirements.txt
      - run: python fb_automation/main.py autoreply
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
